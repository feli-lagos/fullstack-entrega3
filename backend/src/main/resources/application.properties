spring.application.name=huertoverde
server.port=8080

# H2 guardada en un ARCHIVO (backend/data/huertoverdedb.mv.db), no en memoria:
# los productos, usuarios y pedidos siguen ahí aunque se apague el backend.
# Para volver a los datos de ejemplo, apaga el backend y borra la carpeta backend/data.
spring.datasource.url=jdbc:h2:file:./data/huertoverdedb
spring.datasource.username=sa
spring.datasource.password=

# update: crea las tablas o columnas que falten, pero nunca borra los datos
# (create-drop borraba todo cada vez que se apagaba el backend)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Consola web: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./data/huertoverdedb, usuario sa, sin clave)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger UI: http://localhost:8080/swagger-ui.html   (JSON OpenAPI: http://localhost:8080/v3/api-docs)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Solo se documentan los endpoints de la API (no la consola H2 ni otros)
springdoc.paths-to-match=/api/**
# Endpoints ordenados por GET, POST, PUT, DELETE y grupos ordenados alfabéticamente
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
